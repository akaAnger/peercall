name: Bug report
description: Report a reproducible PeerCall problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PeerCall on...
        2. Click...
        3. See...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 126, Safari 17, Firefox 128
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone iOS 17, Android 14, Windows 11
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Include console errors or screenshots if useful.
